<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DanteAI Monitor</title><style>body{margin:0;background:#0c1017;color:#e7edf6;font:15px system-ui;padding:24px}header{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:auto}h1{font-size:22px}.status{padding:7px 12px;border-radius:20px;background:#173d2b}.grid{max-width:1200px;margin:20px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.card{background:#151c27;border:1px solid #263244;border-radius:10px;padding:16px}.label{color:#9facbd;font-size:12px}.value{font-size:30px;margin-top:8px}.sub{font-size:12px;color:#8b97a8;margin-top:9px}.na{color:#718096}canvas{width:100%;height:75px;margin-top:12px}.section{max-width:1200px;margin:28px auto 8px;color:#aeb9c9;font-size:13px;text-transform:uppercase;letter-spacing:.1em}</style><header><h1>DanteAI · Hardware Monitor</h1><span id="status" class="status">CONNECTING</span></header><div class="section">Live metrics</div><main class="grid" id="metrics"></main><div class="section">System detail</div><main class="grid" id="details"></main><script>const cards=[['cpu.temperature_c','CPU temperature','°C'],['gpu.temperature_c','GPU temperature','°C'],['storage.lexar_nm790.temperature_c','Lexar NVMe temperature','°C'],['gpu.power_w','GPU power','W'],['gpu.utilization_percent','GPU utilization','%'],['gpu.vram_used_mb','VRAM used',' MB'],['memory.used_mb','RAM used',' MB']];const detail=[['cpu.utilization_percent','CPU utilization','%'],['memory.available_mb','RAM available',' MB'],['memory.utilization_percent','RAM utilization','%'],['gpu.fan_percent','GPU fan','%'],['gpu.power_limit_w','GPU power limit',' W'],['gpu.vram_total_mb','VRAM total',' MB'],['storage.lexar_nm790.health','Lexar health','']];const get=(o,p)=>p.split('.').reduce((x,k)=>x&&x[k],o);function card([p,n,u],d){let v=get(d,p),h=d.history[p]||[];let text=v==null?'Unavailable':typeof v==='number'?Math.round(v*10)/10+u:v+u;let pts=h.filter(x=>x[1]!=null).map(x=>x[1]);let path='';if(pts.length>1){let lo=Math.min(...pts),hi=Math.max(...pts),r=hi-lo||1;path=pts.map((v,i)=>`${i?'L':'M'}${i/(pts.length-1)*100},${72-(v-lo)/r*62}`).join(' ') }return `<article class="card"><div class="label">${n}</div><div class="value ${v==null?'na':''}">${text}</div><canvas data-p="${p}" data-line="${path}"></canvas></article>`}async function refresh(){try{let d=await fetch('/api/status',{cache:'no-store'}).then(r=>r.json());document.getElementById('status').textContent=d.overall_status;document.getElementById('status').style.background=d.overall_status==='CRITICAL'?'#7f1d1d':d.overall_status==='WARNING'?'#744b12':'#173d2b';metrics.innerHTML=cards.map(x=>card(x,d)).join('');details.innerHTML=detail.map(x=>card(x,d)).join('');document.querySelectorAll('canvas').forEach(c=>{let x=c.getContext('2d'),p=c.dataset.line;c.width=300;c.height=75;if(p){x.strokeStyle='#59b8ff';x.lineWidth=2;x.beginPath();p.match(/[ML][^ML]+/g).forEach((s,i)=>{let a=s.slice(1).split(',').map(Number);i?x.lineTo(...a):x.moveTo(...a)});x.stroke()}})}catch(e){document.getElementById('status').textContent='OFFLINE'}}refresh();setInterval(refresh,2000)</script>
